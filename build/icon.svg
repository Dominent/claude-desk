<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="shell" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#31346d"/>
      <stop offset="1" stop-color="#13142c"/>
    </linearGradient>
    <linearGradient id="lit" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#b3bcff"/>
      <stop offset="1" stop-color="#6675ff"/>
    </linearGradient>
  </defs>

  <rect x="64" y="64" width="896" height="896" rx="208" fill="url(#shell)"/>

  <!-- two lines on the board, one live, joined by a patch cable -->
  <rect x="176" y="272" width="304" height="480" rx="56" fill="url(#lit)"/>
  <rect x="544" y="272" width="304" height="480" rx="56" fill="#474c96"/>

  <path d="M328 470 C 436 470, 452 610, 620 610" stroke="#13142c" stroke-width="76" fill="none" stroke-linecap="round" opacity="0.5"/>
  <path d="M328 470 C 436 470, 452 610, 620 610" stroke="#f4f5ff" stroke-width="40" fill="none" stroke-linecap="round"/>
  <circle cx="328" cy="470" r="52" fill="#f4f5ff"/>
  <circle cx="620" cy="610" r="52" fill="#f4f5ff"/>
</svg>
